# docker-compose for the FireBIM webapp.
#
# Requires the firebim-api-server backend stack to be running first:
#   cd ../firebim-api-server && docker compose up -d
#
# Starting:
#   cp .env.example .env   # fill in NEXTAUTH_SECRET at minimum
#   docker compose up -d --build

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "3000:3000"
    environment:
      # Leave empty so the browser uses the webapp's own proxy routes
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-}
      - NEXT_PUBLIC_UMAMI_ANALYTICS_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_ANALYTICS_WEBSITE_ID:-}
      # Server-side proxy → backend API (running in sibling compose stack)
      - API_BACKEND_URL=${API_BACKEND_URL:-http://host.docker.internal:8000}
      # NextAuth
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      # Authentik OIDC — public issuer URL used by the browser (must match token iss claim)
      - AUTHENTIK_ISSUER_URL=${AUTHENTIK_ISSUER_URL:-http://localhost:9090/application/o/firebim/}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-firebim}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-local-dev-client-secret}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Allows containers to reach the host's localhost-bound ports on all platforms
      - "host.docker.internal:host-gateway"
