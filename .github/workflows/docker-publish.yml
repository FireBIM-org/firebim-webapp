name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx eslint .

  build-and-push:
    name: Build & Push
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Build & push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ env.BUILD_TIME }}

      - name: Sign the published Docker image
        env:
          TAGS: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # ── Deploy to dev (on merge to develop) ──────────────────────────
  deploy-dev:
    name: Deploy → Dev
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Update dev image tag in GitOps repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_PAT }}
          script: |
            const tag = '${{ needs.build-and-push.outputs.image-tag }}';
            const owner = 'FireBIM-org';
            const repo = 'firebim-deploy';
            const path = 'apps/firebim-webapp/overlays/dev/kustomization.yaml';
            const imageName = 'ghcr.io/firebim-org/firebim-webapp';

            const {data} = await github.rest.repos.getContent({owner, repo, path});
            const content = Buffer.from(data.content, 'base64').toString();
            const updated = content.replace(
              new RegExp(`(name: ${imageName.replace(/[/]/g, '\\/')}\\n\\s+newTag: ).*`),
              `$1${tag}  # Updated by CI pipeline`
            );
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chore(dev): update webapp to ${tag}`,
              content: Buffer.from(updated).toString('base64'),
              sha: data.sha,
            });

  # ── Deploy to staging (on merge to main) ─────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Update staging image tag in GitOps repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_PAT }}
          script: |
            const tag = '${{ needs.build-and-push.outputs.image-tag }}';
            const owner = 'FireBIM-org';
            const repo = 'firebim-deploy';
            const path = 'apps/firebim-webapp/overlays/staging/kustomization.yaml';
            const imageName = 'ghcr.io/firebim-org/firebim-webapp';

            const {data} = await github.rest.repos.getContent({owner, repo, path});
            const content = Buffer.from(data.content, 'base64').toString();
            const updated = content.replace(
              new RegExp(`(name: ${imageName.replace(/[/]/g, '\\/')}\\n\\s+newTag: ).*`),
              `$1${tag}  # Updated by CI pipeline`
            );
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chore(staging): update webapp to ${tag}`,
              content: Buffer.from(updated).toString('base64'),
              sha: data.sha,
            });

  # ── Deploy to production (on version tag → creates PR) ───────────
  deploy-production:
    name: Deploy → Production (PR)
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create production deployment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITOPS_PAT }}
          script: |
            const tag = '${{ needs.build-and-push.outputs.image-tag }}';
            const owner = 'FireBIM-org';
            const repo = 'firebim-deploy';
            const branch = `deploy/production-webapp-${tag}`;
            const path = 'apps/firebim-webapp/overlays/production/kustomization.yaml';
            const imageName = 'ghcr.io/firebim-org/firebim-webapp';

            // Create branch from main
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: ref.object.sha});

            const {data} = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            const content = Buffer.from(data.content, 'base64').toString();
            const updated = content.replace(
              new RegExp(`(name: ${imageName.replace(/[/]/g, '\\/')}\\n\\s+newTag: ).*`),
              `$1${tag}  # Updated by CI pipeline`
            );
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `chore(production): update webapp to ${tag}`,
              content: Buffer.from(updated).toString('base64'),
              sha: data.sha,
            });

            await github.rest.pulls.create({
              owner, repo,
              title: `🚀 Production: Webapp ${process.env.GITHUB_REF_NAME} (${tag})`,
              body: `## Production Deployment\n\n**Tag:** \`${process.env.GITHUB_REF_NAME}\`  **Image:** \`${tag}\`\n\n### Image\n- \`${imageName}:${tag}\`\n\n### Checklist\n- [ ] Staging verified\n- [ ] Approved by platform team`,
              head: branch, base: 'main',
            });
