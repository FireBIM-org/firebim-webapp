name: Build & Push Image

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact staging commit SHA or immutable ref to publish'
        required: true
        type: string
      version:
        description: 'Production version without a prefix (for example 0.2.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/firebim-org/firebim-webapp

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Validate production version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be semantic, for example 0.2.0" >&2
            exit 1
          fi

      - name: Resolve image source
        id: source
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
        run: |
          full_sha="$(git rev-parse HEAD)"
          {
            echo "sha=$full_sha"
            echo "short_sha=${full_sha:0:7}"
            echo "ref_name=$SOURCE_REF"
            echo "build_time=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=production-${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.source.outputs.sha }}
            GIT_BRANCH=${{ steps.source.outputs.ref_name }}
            BUILD_TIME=${{ steps.source.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          severity: CRITICAL,HIGH

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
